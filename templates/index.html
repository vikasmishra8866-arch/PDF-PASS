<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Recovery Portal - High Speed Engine</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(-45deg, #020b18, #031329, #082147, #031329);
      background-size: 400% 400%;
      animation: hydroPulse 12s ease infinite;
      color: #f8fafc;
      min-height: 100vh;
    }

    @keyframes hydroPulse {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hydro-card {
      background: rgba(11, 29, 58, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.25);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
    }

    .hydro-input {
      background-color: #031329;
      border: 1px solid #1e3a8a;
      color: #f8fafc;
      transition: all 0.2s ease;
    }

    .hydro-input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
    }

    .hydro-btn {
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
    }

    .hydro-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
    }

    .cyber-terminal {
      background-color: #020b18;
      border: 1px solid rgba(6, 182, 212, 0.2);
      font-family: 'Fira Code', monospace;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    /* Custom Scrollbar for Terminal */
    .cyber-terminal::-webkit-scrollbar {
      width: 5px;
    }
    .cyber-terminal::-webkit-scrollbar-thumb {
      background: #06b6d4;
      border-radius: 4px;
    }
  </style>
</head>
<body class="p-3 sm:p-6 md:p-8 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-4xl hydro-card rounded-2xl p-5 sm:p-8 space-y-6">
    
    <!-- HEADER -->
    <div class="border-b border-slate-800 pb-5 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-cyan-950/60 rounded-xl border border-cyan-500/30 text-cyan-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide">PDF Decryption Engine</h1>
          <p class="text-xs text-slate-400">Multi-Threaded High-Speed Scanner</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
        <span class="h-2.5 w-2.5 rounded-full bg-cyan-400 animate-ping"></span>
        <span class="text-xs font-semibold text-cyan-300">Render Live</span>
      </div>
    </div>

    <!-- MAIN FORM -->
    <form id="crackForm" class="space-y-5">
      
      <!-- FILE UPLOAD DROPZONE -->
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-slate-300 mb-2">Upload Encrypted PDF</label>
        <div class="relative border-2 border-dashed border-slate-700 hover:border-cyan-500/50 bg-slate-900/50 rounded-xl p-4 sm:p-6 text-center cursor-pointer transition-all">
          <input type="file" id="pdfFile" accept=".pdf" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto mb-2 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          <p id="fileName" class="text-xs sm:text-sm font-medium text-slate-300">Click or Drag & Drop Encrypted PDF File</p>
        </div>
      </div>

      <!-- OPTIONS GRID -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase font-bold tracking-wider text-slate-300 mb-2">Scanning Mode</label>
          <select id="mode" class="hydro-input w-full p-3.5 rounded-xl text-xs sm:text-sm font-medium" onchange="toggleHint()">
            <option value="mode1">Name + 4 Digits (Smart Scan)</option>
            <option value="mode2">8-Digit Numeric Brute-Force</option>
          </select>
        </div>
        
        <div id="hintContainer">
          <label class="block text-xs uppercase font-bold tracking-wider text-slate-300 mb-2">Name Hint (Optional)</label>
          <input type="text" id="hint" placeholder="e.g. VIKAS" class="hydro-input w-full p-3.5 rounded-xl text-xs sm:text-sm font-mono uppercase">
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="submit" id="submitBtn" class="hydro-btn w-full py-4 rounded-xl text-white font-bold text-xs sm:text-sm uppercase tracking-wider flex items-center justify-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span>Execute High-Speed Scan</span>
      </button>
    </form>

    <!-- LIVE CYBER TERMINAL SCREEN -->
    <div id="tvContainer" class="hidden space-y-3 pt-2">
      <div class="flex justify-between items-center text-xs text-cyan-400 font-mono">
        <span class="flex items-center space-x-2">
          <span class="h-2 w-2 rounded-full bg-cyan-400 animate-pulse"></span>
          <span>[LIVE SCAN STREAM]</span>
        </span>
        <span id="scanStatus" class="font-bold text-amber-400">PROCESSING...</span>
      </div>

      <!-- PROGRESS BAR -->
      <div class="w-full bg-slate-900 rounded-full h-2 border border-slate-800 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-cyan-500 to-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- TERMINAL BOX -->
      <div class="cyber-terminal rounded-xl p-4 h-52 overflow-y-auto text-xs text-cyan-300 space-y-1.5" id="terminalLog">
        <div>> ENGINE INITIALIZED...</div>
        <div>> MULTI-THREADING POOL READY...</div>
      </div>
    </div>

    <!-- MATCH RESULT BOX -->
    <div id="resultBox" class="hidden p-5 rounded-xl bg-slate-950 border border-emerald-500/50 text-center space-y-2">
      <div class="flex items-center justify-center space-x-2 text-emerald-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-xs uppercase font-bold tracking-widest">PASSWORD UNLOCKED MATCH FOUND</span>
      </div>
      <span id="passResult" class="text-2xl sm:text-3xl font-mono font-bold text-cyan-300 block tracking-wider">--</span>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
